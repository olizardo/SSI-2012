name: Publish Quarto Website

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout the repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Set up R (essential for running your data cleaning and codebook scripts)
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true # Enables ultra-fast pre-compiled Linux binary package installs

      # 3. Set up Quarto CLI
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # 4. Install R dependencies (RSPM makes this extremely fast)
      - name: Install R Dependencies
        run: |
          Rscript -e "install.packages(c('tidyverse', 'haven', 'DT'))"

      # 5. Render and Publish to gh-pages branch automatically
      - name: Render and Publish Website
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          path: website
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
